name: IA DevOps - informe consultivo

# Ejecución manual para controlar la cuota gratuita y la privacidad de datos.
# Sin GEMINI_API_KEY produce sólo informe de evidencia (no IA real).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Tema del PDF que analizará el asistente'
        required: true
        default: 'ci'
        type: choice
        options:
          - desarrollo
          - pruebas
          - ci
          - entrega
          - despliegue
          - supervision
          - iac
          - mantenimiento
          - kanban
      demo_sintetica:
        description: "Ejemplo sin datos privados (genera respuesta real de Gemini sobre caso sintético)"
        required: true
        default: true
        type: boolean
      allow_private_data:
        description: "Autorizo enviar datos de este repositorio privado a la API gratuita de Google (pueden usarse para mejorar productos)"
        required: true
        default: false
        type: boolean
      target:
        description: 'Nº de issue/PR/run o tag de release; puede dejarse vacío para ciertos modos'
        required: false
        type: string

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

jobs:
  informe:
    name: Asistencia IA sin cambiar código ni estados de CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Código estable del repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Analizar evidencia y generar informe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash-lite
          AI_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
          AI_ALLOW_PRIVATE_DATA: ${{ inputs.allow_private_data }}
          AI_DEMO_SINTETICA: ${{ inputs.demo_sintetica }}
          AI_INCLUDE_LOGS: 'false' # cambiar a true sólo tras revisar privacidad de logs
          AI_MODE: ${{ inputs.mode }}
          AI_TARGET: ${{ inputs.target }}
        shell: bash
        run: |
          if [[ "${AI_DEMO_SINTETICA:-true}" == "true" ]]; then
            echo 'Modo demostración: datos sintéticos del repositorio, sin enviar issues privados.'
            python3 tools/ai_devops.py \
              --mode mantenimiento \
              --input-file examples/ia/issue-mantenimiento.json \
              --output artifacts/informe-ia.md
          else
            python3 tools/ai_devops.py \
              --mode "${AI_MODE:-ci}" \
              --target "${AI_TARGET:-}" \
              --output artifacts/informe-ia.md
          fi
          cat artifacts/informe-ia.md >> "$GITHUB_STEP_SUMMARY"
          if ! grep -q 'IA_REAL_EJECUTADA' artifacts/informe-ia.md; then
            echo '::warning::IA NO ejecutada: revisa GEMINI_API_KEY o autorización para repo privado. No presentarlo como inferencia real.'
          fi

      - name: Guardar evidencia de la ejecución
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: informe-ia-devops-${{ github.run_id }}
          path: artifacts/informe-ia.md
          if-no-files-found: warn
          retention-days: 14
