name: Analisis inteligente DevOps

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Area de analisis'
        required: true
        type: choice
        default: ci
        options:
          - desarrollo
          - pruebas
          - ci
          - entrega
          - despliegue
          - supervision
          - iac
          - mantenimiento
          - kanban
      target:
        description: 'ID de ejecucion/Issue/PR o tag de release (en CI, vacio = ultima ejecucion)'
        required: false
        type: string
      allow_private_data:
        description: 'Autorizo transmitir evidencia de repositorio privado a la API externa'
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

concurrency:
  group: ai-devops-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analizar:
    name: Analizar evidencia real del repositorio
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout seguro de codigo estable
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Comprobar requisitos de ejecucion
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [[ -z "$GEMINI_API_KEY" ]]; then
            echo '::error::Configura GEMINI_API_KEY en Settings > Secrets and variables > Actions.'
            exit 1
          fi
          python3 --version
      - name: Elaborar informe consultivo con Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
          AI_ALLOW_PRIVATE_DATA: ${{ inputs.allow_private_data }}
          AI_MODE: ${{ inputs.mode }}
          AI_TARGET: ${{ inputs.target }}
        shell: bash
        run: |
          python3 tools/ai_devops.py \
            --mode "$AI_MODE" \
            --target "$AI_TARGET" \
            --output artifacts/informe-devops.md
      - name: Mostrar resumen ejecutivo y fuentes
        if: always()
        shell: bash
        run: |
          if [[ -f artifacts/informe-devops.md ]]; then
            cat artifacts/informe-devops.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No se genero informe; revisa el log anterior.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Conservar informe y manifiesto de trazabilidad
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: analisis-devops-${{ github.run_id }}
          path: |
            artifacts/informe-devops.md
            artifacts/informe-devops.json
          if-no-files-found: warn
          retention-days: 30
