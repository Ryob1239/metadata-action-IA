name: IA DevOps - pruebas unitarias

on:
  push:
    branches: [master, 'releases/v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unitarias-asistente:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Ejecutar pruebas del asistente sin API ni secretos
        run: python3 -m unittest discover -s tests_ai -v
      - name: Probar generación de reporte sin invocar IA
        run: |
          python3 tools/ai_devops.py \
            --mode mantenimiento \
            --input-file examples/ia/issue-mantenimiento.json \
            --dry-run \
            --output artifacts/ejemplo-offline.md
          grep -q 'NO_EJECUTADA_DRY_RUN' artifacts/ejemplo-offline.md
      - name: Adjuntar prueba de modo offline
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reporte-prueba-offline-${{ github.run_id }}
          path: artifacts/ejemplo-offline.md
          retention-days: 7
