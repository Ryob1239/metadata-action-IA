name: Calidad del asistente IA

on:
  push:
    branches: [main, 'releases/v*']
    paths:
      - 'tools/**'
      - 'tests_ai/**'
      - '.github/workflows/ai-*.yml'
  pull_request:
    paths:
      - 'tools/**'
      - 'tests_ai/**'
      - '.github/workflows/ai-*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    name: Pruebas de seguridad, integracion y resiliencia
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout seguro
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Comprobar sintaxis Python
        run: python3 -m py_compile tools/ai_devops.py tests_ai/test_ai_devops.py
      - name: Ejecutar bateria automatizada del asistente
        run: python3 -m unittest discover -s tests_ai -v
      - name: Comprobar salida de informe sin consumir API
        shell: bash
        run: |
          mkdir -p artifacts
          python3 tools/ai_devops.py \
            --mode mantenimiento \
            --input-file tests_ai/fixtures/issue.json \
            --dry-run \
            --output artifacts/control-local.md
          grep -q 'SIMULACION_SIN_INFERENCIA' artifacts/control-local.md
          test -s artifacts/control-local.json
