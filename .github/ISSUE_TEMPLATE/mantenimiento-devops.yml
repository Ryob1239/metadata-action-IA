name: Mantenimiento DevOps - incidencia reproducible
description: Registrar un problema o mejora con evidencia para pruebas, CI y mantenimiento
title: '[Mantenimiento] '
labels: []
body:
  - type: dropdown
    id: categoria
    attributes:
      label: Tipo de mantenimiento
      description: Selecciona la categoría que mejor corresponde
      options:
        - Correctivo (error existente)
        - Adaptativo (compatibilidad)
        - Perfectivo (mejora)
        - Preventivo (seguridad / pruebas / deuda técnica)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión o commit afectado
      placeholder: 'ej. v6.0.0 o SHA'
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir / contexto
      description: Incluye evento GitHub, inputs relevantes y mensajes SIN secretos
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Resultado esperado
    validations:
      required: true
  - type: textarea
    id: obtenido
    attributes:
      label: Resultado observado
    validations:
      required: true
  - type: textarea
    id: criterio
    attributes:
      label: Criterios de aceptación y pruebas sugeridas
      description: Qué aserciones de Vitest / CI demostrarían la corrección
    validations:
      required: false
